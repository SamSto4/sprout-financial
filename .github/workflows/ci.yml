name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against a dependency already in the lockfile fails the audit step
  # even while nobody is pushing.
  schedule:
    - cron: "17 6 * * 1"

# The job only reads the code. Without this, the token gets the repository's default scope, which
# can include write access, and every install script, lint plugin and test could use it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (a tag can be moved to other code); the comment says which release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the token in .git/config for the steps below; nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships to users (not build tools) fail the check.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Generates next-env.d.ts and the route types (PageProps, RouteContext) the type check needs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
