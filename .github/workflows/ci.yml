name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships to users (not build tools) fail the check.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Generates next-env.d.ts and the route types (PageProps, RouteContext) the type check needs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
